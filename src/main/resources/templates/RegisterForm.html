        <style>
            .form-group {
                padding: 10px;
            }

            .form {
                padding: 120px;
                font-family: "Libre Franklin", sans-serif;
                font-style: normal;
            }

            .form-control {
                border-radius: 30px;
            }

            .form-control:hover {
                box-shadow: 3px 3px 3px 3px rgba(0, 0, 0, 0.19);
            }

            .btn-danger {
                border-radius: 30px;
            }

            .btn-danger:hover {
                background-color: #F5E027;
                color: black;

            }

        </style>

    </head>
    <body>
        <div class="container">
            <form class="form">

                <h1 class="title">Regístrate</h1>

                <div class="row">
                    <div class="form-group">
                        <label for="inputNombre">Nombre</label>
                        <input type="text" class="form-control" id="inputNombre" placeholder="Ingresa tu nombre" onkeydown="SoloLetras(event, this)">
                    </div> 
                    <div class="form-group col-md-6">
                        <label for="inputApellidoP">Apellido paterno</label>
                        <input type="text" class="form-control" id="inputApellidoPaterno" placeholder="Ingresa tu apellido paterno">
                    </div>
                    <br>
                    <div class="form-group col-md-6">
                        <label for="inputApellidoM">Apellido materno</label>
                        <input type="text" class="form-control" id="inputApellidoMaterno" placeholder="Ingresa tu apellido materno">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="inputEmail">Correo electrónico</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="alguien@example.com">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="inputPassword">Contraseña</label>
                        <input type="password" class="form-control" id="inputPassword" placeholder="********">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="inputConfirmPassword">Confirma tu contraseña</label>
                        <input type="password" class="form-control" id="inputConfirmPassword" placeholder="********">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck">
                        <label class="form-check-label" for="gridCheck">
                            Check me out
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-100">Registrarme</button>
            </form>
        </div>
