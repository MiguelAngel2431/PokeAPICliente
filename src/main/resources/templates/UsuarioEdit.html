<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Usuario · Editar</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root{ --red:#ef4444; --ring:#ffd1d1; }
    .nav-grad{ background:linear-gradient(180deg,#fff 0,#fff 60%, #000 60%, #000 63%, #ef4444 63%, #ef4444 100%); }
    .ball{ width:34px;height:34px;border-radius:50%;
      background:radial-gradient(circle at 50% 48%, #fff 0 12px, transparent 13px),
                 linear-gradient(#fff 50%, #000 0 52%, #ef4444 0);
      border:3px solid #000; box-shadow: inset 0 0 0 2px #fff; cursor:pointer; }
    .form-control:focus{ border-color:var(--ring); box-shadow:0 0 0 .25rem rgba(239,68,68,.15) }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="nav-grad shadow-sm">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="ball" aria-hidden="true" onclick="location.href='/'"></div>
        <strong>PokéAPI · Editar usuario</strong>
      </div>
      <a class="btn btn-sm btn-outline-dark" th:href="@{/usuario/list}">Volver</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}">Error</div>

        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h1 class="h5 m-0">Editar usuario</h1>
          </div>
          <div class="card-body">
            <form th:action="@{'/usuario/edit/' + ${Usuario.idUsuario}}" th:object="${Usuario}" method="post" class="row g-3">

              <div class="col-md-2">
                <label class="form-label">ID</label>
                <input class="form-control" th:value="${Usuario.idUsuario}" disabled>
              </div>

              <div class="col-md-4">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" class="form-control" th:field="*{nombre}" required>
              </div>

              <div class="col-md-3">
                <label for="apP" class="form-label">Apellido paterno</label>
                <input id="apP" class="form-control" th:field="*{apellidoPaterno}">
              </div>

              <div class="col-md-3">
                <label for="apM" class="form-label">Apellido materno</label>
                <input id="apM" class="form-control" th:field="*{apellidoMaterno}">
              </div>

              <div class="col-md-6">
                <label for="username" class="form-label">Username</label>
                <input id="username" class="form-control" th:field="*{username}" required>
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" th:field="*{email}">
              </div>

              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-danger">Guardar cambios</button>
                <a th:href="@{/usuario/list}" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
          <div class="card-footer bg-white">
            <small class="text-muted">Los campos marcados como requeridos deben completarse.</small>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
