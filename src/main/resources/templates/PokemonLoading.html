<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cargando Pokédex…</title>
  <style>
    :root{
      --ink:#0f172a; --muted:#64748b; --red:#ef4444; --bg:#fff;
      --chip:#fee2e2; --line:#fecaca; --shadow:rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    .wrap{max-width:820px;margin:56px auto;padding:0 16px;text-align:center}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 10px 20px var(--shadow);padding:28px}
    .title{font-weight:800;font-size:28px;margin:14px 0 8px}
    .muted{color:var(--muted)}
    .bar{height:14px;border-radius:999px;background:#fde2e2; overflow:hidden; border:1px solid var(--line); margin:18px 0}
    .bar i{display:block;height:100%;width:0%;background:var(--red);transition:width .35s ease}
    .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
    .chip{background:#fff;border:1px solid var(--line);color:#b91c1c;border-radius:999px;padding:6px 10px;font-weight:800}

    /* Pokébola */
    .ballWrap{display:flex;justify-content:center;margin:4px 0 16px}
    .ball{
      width:84px;height:84px;border-radius:50%;position:relative;overflow:hidden;border:6px solid #111;
      animation: spin 1.2s linear infinite; /* Giro */
    }
    .ball::before{
      content:"";position:absolute;inset:0;background:
        radial-gradient(circle at 50% 48%, #fff 0 28px, transparent 29px),
        linear-gradient(#fff 50%, #000 0 52%, #ef4444 0);
    }
    .ball::after{
      content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;
      width:22px;height:22px;border-radius:50%;background:#fff;border:6px solid #111;box-shadow:0 0 0 4px #fff inset;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .hint{font-size:12px;color:var(--muted);margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="ballWrap">
        <div class="ball" aria-hidden="true"></div>
      </div>
      <h1 class="title">Preparando la Pokédex…</h1>
      <p class="muted">Descargando y cacheando Pokémon para que la búsqueda y filtros sean instantáneos.</p>

      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-live="polite">
        <i id="pb" style="width:0%"></i>
      </div>

      <div class="chips">
        <span class="chip"><strong>Progreso:</strong> <span id="progress">0</span>%</span>
        <span class="chip"><strong>En caché:</strong> <span id="count">0</span></span>
      </div>
      <p class="hint" id="last"></p>

      <input type="hidden" id="redirectTo" th:value="${redirectTo} ?: '/pokemon'"/>
    </div>
  </main>

  <script>
    const pb  = document.getElementById('pb');
    const pEl = document.getElementById('progress');
    const cEl = document.getElementById('count');
    const last= document.getElementById('last');
    const to  = document.getElementById('redirectTo').value || '/pokemon';

    async function tick(){
      try{
        const r = await fetch('/pokemon/status',{cache:'no-store'});
        const st = await r.json();
        const prog = Number(st.progress||0);
        const cnt  = Number(st.count||0);
        const warm = !!st.warming;
        const ready= !!st.ready;              

        pEl.textContent = prog;
        cEl.textContent = cnt;
        pb.style.width = Math.max(2, Math.min(100, prog)) + '%';
        last.textContent = st.lastUpdated ? ('Última actualización: ' + st.lastUpdated) : '';

        if (ready && cnt > 0) {
          setTimeout(()=>{ window.location.href = to; }, 350);
          return;
        }
        // Si no está lista, sigue en polling
      }catch(e){
        // ignore, reintenta
      }
      setTimeout(tick, 1200);
    }
    tick();
  </script>
</body>
</html>
