<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cargando Pokédex…</title>
  <style>
    :root{ --ink:#0f172a; --muted:#64748b; --red:#ef4444; --bg:#fff; --chip:#fee2e2; }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    .wrap{max-width:760px;margin:60px auto;padding:0 16px;text-align:center}
    .ball{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;position:relative;overflow:hidden;border:6px solid #000}
    .ball::before{content:"";position:absolute;inset:0;background:
      radial-gradient(circle at 50% 48%, #fff 0 28px, transparent 29px),
      linear-gradient(#fff 50%, #000 0 52%, #ef4444 0);}
    .title{font-weight:800;font-size:28px;margin:10px 0 8px}
    .muted{color:var(--muted)}
    .bar{height:14px;border-radius:999px;background:#fde2e2; overflow:hidden; border:1px solid #fecaca; margin:18px 0}
    .bar i{display:block;height:100%;width:0%;background:var(--red);transition:width .35s ease}
    .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
    .chip{background:#fff;border:1px solid #fecaca;color:#b91c1c;border-radius:999px;padding:6px 10px;font-weight:800}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="ball" aria-hidden="true"></div>
    <h1 class="title">Preparando la Pokédex…</h1>
    <p class="muted">Estamos descargando y cacheando todos los Pokémon para que la búsqueda y filtros sean instantáneos.</p>

    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-live="polite">
      <i id="pb" style="width:0%"></i>
    </div>

    <div class="chips">
      <span class="chip"><strong>Progreso:</strong> <span id="progress" th:text="${progress}">0</span>%</span>
      <span class="chip"><strong>En caché:</strong> <span id="count" th:text="${count}">0</span></span>
    </div>
    <p class="hint" id="last"></p>

    <!-- La ruta a la que redirigir cuando termine -->
    <input type="hidden" id="redirectTo" th:value="${redirectTo} ?: '/pokemon'"/>

    <script>
      const pb  = document.getElementById('pb');
      const pEl = document.getElementById('progress');
      const cEl = document.getElementById('count');
      const last= document.getElementById('last');
      const to  = document.getElementById('redirectTo').value || '/pokemon';

      function tick(){
        fetch('/pokemon/status',{cache:'no-store'})
          .then(r => r.json())
          .then(st => {
            const prog = Number(st.progress||0);
            const cnt  = Number(st.count||0);
            const warm = !!st.warming;

            pEl.textContent = prog;
            cEl.textContent = cnt;
            pb.style.width = Math.max(2, Math.min(100, prog)) + '%';
            last.textContent = st.lastUpdated ? ('Última actualización: ' + st.lastUpdated) : '';

            if(!warm){
              // pequeño delay visual y redirige
              setTimeout(()=>{ window.location.href = to; }, 500);
            }else{
              setTimeout(tick, 1200);
            }
          })
          .catch(() => setTimeout(tick, 1500));
      }
      // arranca con los valores del modelo y sigue en polling
      setTimeout(tick, 800);
      
      
       const REDIRECT = /*[[${redirectTo}]]*/ '/pokemon'; // thymeleaf o usa un data-attr
  async function poll(){
    try{
      const r = await fetch('/pokemon/status');
      const st = await r.json();
      document.getElementById('progress').textContent = (st.progress ?? 0) + '%';
      if (!st.warming) {
        window.location.href = REDIRECT;
        return;
      }
    }catch(_){}
    setTimeout(poll, 1200);
  }
  poll();
    </script>
    <div class="loading">
  <h2>Cargando catálogo…</h2>
  <p>Progreso: <span id="progress">0%</span></p>
</div>
  </main>
</body>
</html>
