<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cargando Pokédex…</title>
  <style>
    :root{ --red:#ef4444; --ink:#0f172a; --muted:#64748b; }
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);display:grid;min-height:100vh;place-items:center;background:#fff}
    .card{width:min(640px,92vw);border:1px solid #f1f5f9;border-radius:16px;padding:22px;box-shadow:0 12px 28px rgba(15,23,42,.08)}
    h1{margin:0 0 10px;font-weight:800}
    .muted{color:var(--muted)}
    .bar{height:12px;border-radius:999px;background:#fee2e2;overflow:hidden;margin-top:8px}
    .bar>i{display:block;height:100%;background:var(--red);width:0%}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    .btn{margin-top:16px;display:inline-block;padding:10px 12px;border-radius:12px;border:1px solid #fecaca;background:#fff;color:var(--red);font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <section class="card">
    <h1>Cargando recursos de Pokédex…</h1>
    <p class="muted">Estamos precargando datos para que tus consultas sean instantáneas.</p>
    <div class="bar"><i id="pbar"></i></div>
    <div class="row">
      <div class="muted">Progreso</div>
      <strong id="pct">0%</strong>
    </div>
    <a class="btn" th:href="${redirectTo}">Ir ahora (puede tardar)</a>
  </section>

  <script>
    const pct = document.getElementById('pct');
    const pbar = document.getElementById('pbar');
    const redirectTo = /*[[${redirectTo}]]*/ '/pokemon';

    async function tick(){
      try{
        const r = await fetch('/pokemon/status', {cache:'no-store'});
        const s = await r.json();
        const p = Math.max(0, Math.min(100, +s.progress || 0));
        pct.textContent = p + '%';
        pbar.style.width = p + '%';
        if(!s.warming || p >= 100){
          // ya calentado: nos vamos a la vista solicitada
          window.location.replace(redirectTo);
          return;
        }
      }catch(_){}
      setTimeout(tick, 1200);
    }
    tick();
  </script>
</body>
</html>
