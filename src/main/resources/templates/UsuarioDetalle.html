<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Usuario · Detalle</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{ --red:#ef4444; }
    .nav-grad{
      background:linear-gradient(180deg,#fff 0,#fff 60%, #000 60%, #000 63%, #ef4444 63%, #ef4444 100%);
    }
    .ball{
      width:34px;height:34px;border-radius:50%;
      background:
        radial-gradient(circle at 50% 48%, #fff 0 12px, transparent 13px),
        linear-gradient(#fff 50%, #000 0 52%, #ef4444 0);
      border:3px solid #000; box-shadow: inset 0 0 0 2px #fff; cursor:pointer;
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="nav-grad shadow-sm">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-2">
        <div class="ball" aria-hidden="true" onclick="location.href='/pokemon'"></div>
        <strong>PokéAPI · Usuario</strong>
      </div>
      <a class="btn btn-sm btn-outline-dark" th:href="@{/usuario/list}">Volver</a>
    </div>
  </nav>

  <main class="container py-4" id="content">
    <!-- FRAGMENTO que usa el offcanvas: /usuario/by-username -> 'UsuarioDetalle :: content' -->
    <div th:fragment="content">
      <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}">Usuario no encontrado</div>

      <div th:if="${usuario != null}" class="card shadow-sm">
        <div class="card-header bg-white">
          <h1 class="h5 m-0">Detalle del usuario</h1>
        </div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${usuario.idUsuario}">1</dd>

            <dt class="col-sm-3">Nombre</dt>
            <dd class="col-sm-9" th:text="${usuario.nombre != null ? usuario.nombre : '—'}">Ash</dd>

            <dt class="col-sm-3">Apellidos</dt>
            <dd class="col-sm-9">
              <span th:text="${usuario.apellidoPaterno != null ? usuario.apellidoPaterno : '—'}">Ketchum</span>
              <span th:text="${' ' + (usuario.apellidoMaterno != null ? usuario.apellidoMaterno : '')}"></span>
            </dd>

            <dt class="col-sm-3">Username</dt>
            <dd class="col-sm-9" th:text="${usuario.username != null ? usuario.username : '—'}">ash</dd>

            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9">
              <a th:if="${usuario.email != null}"
                 th:href="${'mailto:' + usuario.email}"
                 th:text="${usuario.email}">ash@pokemon.com</a>
              <span th:if="${usuario.email == null}" class="text-muted">—</span>
            </dd>

            <dt class="col-sm-3">Rol</dt>
            <dd class="col-sm-9" th:text="${usuario.rol != null ? usuario.rol.nombre : '—'}">—</dd>
          </dl>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
          <a class="btn btn-outline-primary" th:href="@{'/usuario/edit/' + ${usuario.idUsuario}}">Editar</a>
          <a class="btn btn-outline-secondary" th:href="@{/usuario/list}">Volver al listado</a>
        </div>
      </div>
    </div>
    <!-- /fragment -->
  </main>
</body>
</html>
